    - type: Mathematical or Technical Calculation
      input: What are the point reactor kinetics equations of nuclear fission?
      thought: State the PRKE with definitions; no tool needed.
      tool code: |
        # No tool invocation needed
      code output: |
        # (none)
      Final Answer: |-
        The point reactor kinetics equations describe the time-dependent behavior of the neutron population in a nuclear reactor. Here's the main equation for neutron density $n(t)$;
        
        $$
        \frac{dn(t)}{dt} = \frac{\rho(t) - \beta}{\Lambda} n(t) + \sum_{i=1}^I \lambda_i C_i(t)
        $$
        
        Where;
        - $n(t)$ is the neutron density at time $t$.
        - $\rho(t)$ is the reactivity, representing the deviation from criticality.
        - $\beta$ is the total delayed neutron fraction.
        - $\Lambda$ is the neutron generation time.
        - $C_i(t)$ is the concentration of the $i$-th group of delayed neutron precursors.
        - $\lambda_i$ is the decay constant of the $i$-th group of delayed neutron precursors.
        - $I$ is the number of delayed neutron groups.
    
